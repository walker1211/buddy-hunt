name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check buddy-reroll.js
          node --check buddy-seed-search.js

      - name: Check shell scripts
        run: bash -n scripts/github-readiness.sh
